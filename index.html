<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/brand/Fabrique-symbol-orange-clearspace.svg" type="image/svg+xml" />
<title>Fabrique · 国内线下门店 2026 年 9 月复盘</title>
<meta name="description" content="Fabrique 国内线下门店 2026 年 9 月月报：四家正店业绩达成、流量转化、商品结构与导购目标拆解。" />
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body data-page="home">

<section class="hero">
  <div class="hero-frost" aria-hidden="true"></div>

  <div class="hero-inner">
    <header id="site-nav"></header>

    <div class="hero-body">
      <div class="hero-row">
        <div class="hero-copy">
          <p class="hero-eyebrow anim anim-up" style="animation-delay:280ms">Fabrique · 国内线下门店</p>
          <h1 class="hero-title anim anim-up" style="animation-delay:300ms">
            国内线下门店<br />2026 年 9 月复盘
          </h1>
          <p class="hero-sub anim anim-up" style="animation-delay:500ms">
            复盘窗口 2026-09-01 至 2026-09-30，覆盖深圳万象天地、北京三里屯、上海太古汇、杭州万象城四家正店。
          </p>
          <div class="cta-row anim anim-up" style="animation-delay:700ms">
            <a class="btn btn-light" href="analysis.html">查看分析总结</a>
            <a class="btn btn-ghost" href="store-shenzhen.html">查看门店数据</a>
          </div>
        </div>

        <div class="kpi-wrap anim anim-scale" style="animation-delay:900ms">
          <div class="kpi-card">
            <p class="kpi-card-label">销售金额达成</p>
            <p class="kpi-card-amount"><span id="hero-amount">—</span></p>
            <div class="kpi-card-delta">
              <span class="chip-badge" id="hero-rate">—</span>
              <span class="chip-badge" id="hero-diff">—</span>
              <span class="kpi-card-caption" id="hero-caption"></span>
            </div>
            <div class="chart hero-chart" data-chart="hero-stores" id="hero-chart"></div>
            <div class="hero-axis" id="hero-axis"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<main>
  <section class="section">
    <div class="narrow">
      <div class="section-head">
        <span class="section-index">01</span>
        <h2>本期四个关键数字</h2>
        <p class="section-note">全部取自复盘表 1 汇总行</p>
      </div>
      <div class="kpi-grid" id="kpi-grid"></div>
      <ul class="legend" id="kpi-legend"></ul>
    </div>
  </section>

  <section class="section">
    <div class="narrow">
      <div class="section-head">
        <span class="section-index">02</span>
        <h2>四家正店</h2>
        <p class="section-note">点开任一门店查看该店的四问结论与数据</p>
      </div>
      <div class="entry-list" id="store-cards"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/charts.js"></script>
</body>
</html>
