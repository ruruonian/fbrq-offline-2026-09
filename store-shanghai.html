<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/brand/Fabrique-symbol-orange-clearspace.svg" type="image/svg+xml" />
<title>上海太古汇 · Fabrique 国内线下门店 2026 年 9 月复盘</title>
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body data-page="store" data-store="上海太古汇精品店">

<header id="site-nav"></header>

<main>
  <div class="narrow page-head">
    <p class="eyebrow">Store review</p>
    <h1 class="page-title">上海太古汇</h1>
    <p class="page-sub">
      2026 年 9 月月报门店视图：该店相关结论与全店总览，四问顺序为场 → 员 → 人 → 货；
      数据区显示汇总行与该店行，表 3 六块显示全部正店合计段与该店段。
    </p>
  </div>

  <nav class="anchors" aria-label="页面锚点">
    <div class="narrow">
      <ul>
        <li><a href="#diagnosis">四问结论</a></li>
        <li><a href="#charts">该店图表</a></li>
        <li><a href="#data">该店数据</a></li>
      </ul>
    </div>
  </nav>

  <section class="section" id="diagnosis">
    <div class="narrow">
      <div class="section-head">
        <span class="section-index">01</span>
        <h2>四问结论</h2>
        <p class="section-note">只放该店相关条目与全店总览结论</p>
      </div>
      <div id="diagnosis-grid"></div>
    </div>
  </section>

  <section class="section" id="charts">
    <div class="narrow">
      <div class="section-head">
        <span class="section-index">02</span>
        <h2>该店图表</h2>
      </div>
      <div class="grid">
        <div class="card">
          <p class="kpi-label">四家正店达成率对比</p>
          <div class="chart" data-chart="store-rate"></div>
        </div>
        <div class="card">
          <p class="kpi-label">该店一级品类销售额结构</p>
          <div class="chart" data-chart="category"></div>
        </div>
        <div class="card">
          <p class="kpi-label">该店年季销售额结构</p>
          <div class="chart" data-chart="season"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="data">
    <div class="narrow">
      <div class="section-head">
        <span class="section-index">03</span>
        <h2>该店数据</h2>
        <p class="section-note">汇总行 + 该店行；表 4 只列该店导购</p>
      </div>
      <div id="tables"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/charts.js"></script>
</body>
</html>
